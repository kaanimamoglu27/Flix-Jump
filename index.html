:root{--navy:#0b2a5c;--navy2:#143a78;--red:#e22511;--yellow:#ffc20e;--cream:#fbf6ea;--ink:#1a1012;--hud:'Baloo',system-ui,sans-serif;--ui:'Baloo',system-ui,'PingFang SC','Noto Sans SC',sans-serif;--disp:'Lucky','Baloo','PingFang SC',sans-serif;color-scheme:dark}
html,body{margin:0;height:100%;background:#1b1238;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;font-family:var(--ui)}
#app{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#cv.pix{image-rendering:pixelated;image-rendering:crisp-edges}
button{font-family:var(--ui);cursor:pointer;-webkit-tap-highlight-color:transparent;color:inherit}
canvas.ic{width:22px;height:22px;display:inline-block;vertical-align:middle;flex:none}
/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;font-family:var(--hud)}
.top{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;align-items:flex-start;gap:8px;padding:0 12px}
.top img{width:54px;height:auto}
.sc{display:flex;flex-direction:column;line-height:1}
.sc b{font-size:28px;color:#fff;-webkit-text-stroke:5px var(--navy);paint-order:stroke fill;font-weight:800}
.sc i{font-style:normal;font-size:11px;color:var(--yellow);-webkit-text-stroke:3px var(--navy);paint-order:stroke fill;margin-top:3px;font-weight:800}
.pills{margin-left:auto;display:flex;gap:6px;align-items:center}
.pill{display:flex;align-items:center;gap:4px;background:rgba(11,42,92,.86);color:#fff;border-radius:16px;padding:3px 10px 3px 5px;font-size:15px;font-weight:800;min-height:26px}
.rbtn{pointer-events:auto;width:38px;height:38px;border-radius:50%;border:none;background:rgba(11,42,92,.86);color:#fff;display:grid;place-items:center;padding:0}
.rbtn svg{width:18px;height:18px;fill:currentColor}
#prog{position:absolute;left:10px;top:calc(env(safe-area-inset-top,0px) + 120px);width:6px;height:36vh;border-radius:6px;background:rgba(11,42,92,.4)}
#prog .f{position:absolute;left:0;right:0;bottom:0;border-radius:6px;background:var(--yellow)}
#prog canvas{position:absolute;left:50%;top:-30px;width:26px;height:26px;transform:translateX(-50%)}
#bossBar{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 84px);width:60%;height:14px;border-radius:8px;background:rgba(11,42,92,.8);overflow:hidden}
#bossBar .f{height:100%;background:var(--red);width:100%;transition:width .15s}
#bossBar span{position:absolute;inset:0;text-align:center;font-size:9.5px;line-height:14px;color:#fff;font-weight:800;letter-spacing:.6px}
.btns{position:absolute;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:auto}

@keyframes quipL{0%{opacity:0;translate:-120% 0}9%,86%{opacity:1;translate:0 0}100%{opacity:0;translate:-120% 0}}

@keyframes quipF{0%{opacity:0;transform:translateX(-50%) scale(.6)}8%,88%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) scale(1)}}

.hdr{display:flex;align-items:center;gap:8px;width:100%;max-width:520px}

#iris{position:absolute;inset:0;pointer-events:none;z-index:8}
#intro{visibility:hidden;position:absolute;left:0;right:0;top:30%;display:flex;flex-direction:column;align-items:center;pointer-events:none;z-index:7}
#intro .a{font-family:var(--disp);font-size:20px;color:#fff;background:var(--red);padding:4px 16px;border-radius:12px;transform:rotate(-2deg)}

  'use strict';
  let ac = null;
  let master = null;
  let noiseBuf = null;
  let rocket = null;
  let muted = false;

  function init() {
    if (ac) {
      if (ac.state === 'suspended') ac.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain();
    master.gain.value = muted ? 0 : 0.55;
    master.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }

  function setMuted(m) {
    muted = m;
    if (m) rocketStop();
    if (master) master.gain.setTargetAtTime(m ? 0 : 0.55, ac.currentTime, 0.02);
  }

  function tone(f, f2, dur, { type = 'sine', vol = 0.25, delay = 0, attack = 0.006 } = {}) {
    if (!ac || muted) return;
    const t = ac.currentTime + delay;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (f2 && f2 !== f) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(master);
    o.start(t);
    o.stop(t + dur + 0.03);
  }

  function noise(dur, { vol = 0.2, freq = 1000, f2 = 0, q = 0.8, delay = 0 } = {}) {
    if (!ac || muted) return;
    const t = ac.currentTime + delay;
    const src = ac.createBufferSource();
    src.buffer = noiseBuf;
    const f = ac.createBiquadFilter();
    f.type = 'bandpass';
    f.Q.value = q;
    f.frequency.setValueAtTime(freq, t);
    if (f2) f.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(master);
    src.start(t);
    src.stop(t + dur + 0.03);
  }

  function seq(notes, step, opts) {
    notes.forEach((n, i) => tone(n, n, opts.dur || 0.16, { ...opts, delay: (opts.delay || 0) + i * step }));
  }

  function rocketStart() {
    if (!ac || muted || rocket) return;
    const src = ac.createBufferSource();
    src.buffer = noiseBuf;
    src.loop = true;
    const f = ac.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.value = 650;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.4, ac.currentTime + 0.12);
    src.connect(f).connect(g).connect(master);
    src.start();
    rocket = { src, g };
  }

  function rocketStop() {
    if (!rocket) return;
    const { src, g } = rocket;
    rocket = null;
    try {
      g.gain.setTargetAtTime(0.0001, ac.currentTime, 0.06);
      src.stop(ac.currentTime + 0.35);
    } catch (e) { /* already stopped */ }
  }

  return {
    init,
    setMuted,
    rocketStart,
    rocketStop,
    jump() { const b = 320 + Math.random() * 70; tone(b, b * 2.2, 0.15, { type: 'triangle', vol: 0.2 }); },
    spring() { tone(200, 900, 0.32, { vol: 0.3 }); tone(400, 1400, 0.24, { type: 'triangle', vol: 0.1, delay: 0.03 }); },
    coin(n = 1) {
      const f = 900 * Math.pow(1.06, Math.min(n, 10));
      tone(f, f, 0.06, { type: 'square', vol: 0.06 });
      tone(f * 1.5, f * 1.5, 0.14, { type: 'square', vol: 0.06, delay: 0.055 });
    },
    perfect() { tone(660, 1320, 0.14, { vol: 0.14 }); },
    crumble() { noise(0.28, { vol: 0.4, freq: 600, f2: 120, q: 0.6 }); },
    cloud() { noise(0.35, { vol: 0.14, freq: 2600, f2: 700, q: 0.5 }); },
    stomp() {
      tone(200, 60, 0.18, { type: 'square', vol: 0.18 });
      noise(0.1, { vol: 0.25, freq: 900 });
      tone(520, 1200, 0.15, { type: 'triangle', vol: 0.14, delay: 0.07 });
    },
    power() { seq([523, 659, 784, 1047], 0.06, { type: 'triangle', vol: 0.15, dur: 0.14 }); },
    shield() { noise(0.35, { vol: 0.3, freq: 3200, f2: 500, q: 2 }); tone(880, 440, 0.3, { vol: 0.12 }); },
    hit() { tone(420, 70, 0.55, { type: 'sawtooth', vol: 0.2 }); noise(0.2, { vol: 0.3, freq: 400 }); },
    fall() { tone(950, 110, 1.0, { vol: 0.18 }); },
    over() { seq([392, 330, 262, 196], 0.16, { type: 'triangle', vol: 0.16, dur: 0.24, delay: 0.1 }); },
    best() { seq([523, 659, 784, 1047, 1319], 0.07, { type: 'square', vol: 0.06, dur: 0.18 }); },
    zone() { tone(392, 784, 0.5, { vol: 0.14 }); tone(587, 1175, 0.5, { vol: 0.09, delay: 0.1 }); },
    click() { tone(650, 950, 0.05, { vol: 0.1 }); },
    deny() { tone(220, 160, 0.18, { type: 'square', vol: 0.08 }); },
    unlock() { seq([659, 784, 988, 1319], 0.08, { type: 'triangle', vol: 0.14, dur: 0.2 }); },
  };
})();
</script>

// ---------- drawing state
let ctx,S,C,K;
function shapeFill(path,col,bb){
  const m=S.mode;

      ctx.beginPath();ctx.ellipse(bb[0]+bb[2]*.3,bb[1]+bb[3]*.22,bb[2]*.13,bb[3]*.08,-.6,0,TAU);ctx.fill();ctx.restore();}
    if(S.post==='dark'){ctx.save();path();ctx.clip();ctx.globalAlpha=.55;ctx.strokeStyle='#7dffc8';ctx.lineWidth=2.2;
      ctx.translate(-2,-1.5);path();ctx.stroke();ctx.restore();}
  } else if(m==='water'){
    ctx.save();ctx.globalAlpha=.9;ctx.fillStyle=shade(col,.08);path();ctx.fill();
    ctx.globalAlpha=.35;ctx.translate(1.5,1);ctx.fillStyle=col;path();ctx.fill();ctx.restore();
    ctx.save();path();ctx.clip();ctx.globalAlpha=.32;ctx.fillStyle=shade(col,-.25);
    ctx.translate(bb[2]*.1,bb[3]*.14);path();ctx.fill();ctx.restore();

function drawBG(){

function city(layer,col,top,var_,seed){

const BAYER=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]].map(r=>r.map(v=>(v+.5)/16-.5));
function lum(r,g,b){return (.299*r+.587*g+.114*b)/255;}
function quantize(c){
  const x=c.getContext('2d'),d=x.getImageData(0,0,c.width,c.height),a=d.data,w=c.width;
  let pal=(S.pal||[]).map(rgb);
  if(S.quant==='kmeans'){pal=kmeans(a,S.k);}
  const pl=S.quant==='lum'?pal.map(p=>lum(...p)):null;
  for(let i=0;i<a.length;i+=4){const px=(i/4)%w,py=Math.floor(i/4/w),b=BAYER[py%4][px%4]*S.dither;
    if(S.quant==='lum'){let l=lum(a[i],a[i+1],a[i+2]);const n=pal.length;l=Math.min(1,Math.max(0,(l-pl[0])/(pl[n-1]-pl[0])+b/(n-1)));
      const idx=Math.round(l*(n-1));const p=pal[idx];a[i]=p[0];a[i+1]=p[1];a[i+2]=p[2];}
    else if(S.quant==='poster'){const L=S.levels-1;for(let k=0;k<3;k++){a[i+k]=Math.round(Math.min(L,Math.max(0,a[i+k]/255*L+b)))*255/L;}}
    else{const r=a[i]+b*48,g=a[i+1]+b*48,bb=a[i+2]+b*48;let best=0,bd=1e9;
      for(let j=0;j<pal.length;j++){const p=pal[j],dr=r-p[0],dg=g-p[1],db=bb-p[2],dd=dr*dr*.3+dg*dg*.59+db*db*.11;if(dd<bd){bd=dd;best=j;}}
      const p=pal[best];a[i]=p[0];a[i+1]=p[1];a[i+2]=p[2];}
    a[i+3]=255;}
  x.putImageData(d,0,0);
}
function kmeans(a,k){const pts=[];for(let i=0;i<a.length;i+=4*7)pts.push([a[i],a[i+1],a[i+2]]);
  const r=rnd(11);let c=[];for(let i=0;i<k;i++)c.push(pts[Math.floor(r()*pts.length)].slice());
  for(let it=0;it<10;it++){const s=c.map(()=>[0,0,0,0]);for(const p of pts){let b=0,bd=1e9;c.forEach((q,j)=>{const d=(p[0]-q[0])**2+(p[1]-q[1])**2+(p[2]-q[2])**2;if(d<bd){bd=d;b=j;}});s[b][0]+=p[0];s[b][1]+=p[1];s[b][2]+=p[2];s[b][3]++;}
    c=c.map((q,j)=>s[j][3]?[s[j][0]/s[j][3],s[j][1]/s[j][3],s[j][2]/s[j][3]]:q);}
  // add saturated brand colors so they survive
  return c.concat([rgb(BASE.zomb),rgb(BASE.cyan),rgb(BASE.pink),rgb(BASE.red),rgb(BASE.yellow),rgb(BASE.navy),rgb('#ffffff'),rgb(BASE.ink)]);}
function noiseCanvas(w,h,seed,scale){const c=document.createElement('canvas');c.width=w/scale|0;c.height=h/scale|0;const x=c.getContext('2d');const d=x.createImageData(c.width,c.height);const r=rnd(seed);

function post(c){
  const x=c.getContext('2d'),w=c.width,h=c.height;
  if(S.post==='water'){
    const t=document.createElement('canvas');t.width=w;t.height=h;const tx=t.getContext('2d');tx.filter='blur(5px)';tx.drawImage(c,0,0);
    x.save();x.globalAlpha=.16;x.globalCompositeOperation='multiply';x.drawImage(t,0,0);x.restore();
    // pigment blotches
    const r=rnd(5);x.save();x.globalCompositeOperation='multiply';for(let i=0;i<70;i++){const bx=r()*w,by=r()*h,br=40+r()*160;const g=x.createRadialGradient(bx,by,0,bx,by,br);g.addColorStop(0,'rgba(120,90,70,.06)');g.addColorStop(1,'rgba(120,90,70,0)');x.fillStyle=g;x.fillRect(bx-br,by-br,2*br,2*br);}x.restore();
    // paper
    const n=noiseCanvas(w,h,9,1.5);x.save();x.globalCompositeOperation='soft-light';x.globalAlpha=.28;x.filter='blur(.6px)';x.drawImage(n,0,0,w,h);x.restore();
    const n2=noiseCanvas(w,h,4,14);x.save();x.globalCompositeOperation='soft-light';x.globalAlpha=.2;x.filter='blur(6px)';x.drawImage(n2,0,0,w,h);x.restore();
    x.save();x.globalCompositeOperation='screen';x.fillStyle='rgba(255,246,230,.05)';x.fillRect(0,0,w,h);x.restore();
  }
  if(S.post==='clay'){
    const n=noiseCanvas(w,h,21,3);x.save();x.globalCompositeOperation='overlay';x.globalAlpha=.07;x.filter='blur(1.4px)';x.drawImage(n,0,0,w,h);x.restore();
    const n2=noiseCanvas(w,h,22,10);x.save();x.globalCompositeOperation='soft-light';x.globalAlpha=.16;x.filter='blur(5px)';x.drawImage(n2,0,0,w,h);x.restore();
    vignette(x,w,h,.35,'#2a1420');
  }
  if(S.post==='dark'){
    x.save();x.globalCompositeOperation='multiply';x.fillStyle='#b4b8cc';x.fillRect(0,0,w,h);x.restore();
    for(let i=0;i<4;i++){const g=x.createLinearGradient(0,h*(.2+i*.2),0,h*(.35+i*.2));g.addColorStop(0,'rgba(80,140,110,0)');g.addColorStop(.5,'rgba(90,160,120,.15)');g.addColorStop(1,'rgba(80,140,110,0)');x.fillStyle=g;x.fillRect(0,0,w,h);}
    const n=noiseCanvas(w,h,31,2);x.save();x.globalCompositeOperation='overlay';x.globalAlpha=.12;x.drawImage(n,0,0,w,h);x.restore();
    vignette(x,w,h,.6,'#000000');
  }
  if(S.post==='cel'){vignette(x,w,h,.2,'#120830');}
}

        x+=w+4;}};blk(c1,CH-90,60+L.n);blk(c2,CH-10,70+L.n);}

// ---------- world

function spawnRow(){

function update(){

  for(const q of tuys){q.t++;if(q.got||!playing||PL.dead)continue;if(Math.hypot(PL.x-q.x,PL.y-10-q.y)<PL.hw+18){q.got=true;runTuy++;Sfx.unlock();vib(20);popup(q.x,q.y-20,'+1','#ffc20e',22);sparkle(q.x,q.y,14,[TH.C.blue,TH.C.green,TH.C.yellow]);}}
  // shots

    let best=null,bd=150;for(const e of ens){if(e.dead)continue;const dy=s.y-e.y;if(dy<0||dy>420)continue;const dx=Math.abs(e.x-s.x);if(dx<bd){bd=dx;best=e;}}

window.addEventListener('flixprices',()=>{if(!$('#shop').hidden)renderShop();});
function buyIAP(id,label,price){
  if(window.FlixNative&&FlixNative.buy){FlixNative.buy(id).then(r=>{if(r==='pending')confirmBox(label,t('buyPending'),null);});return;}
  confirmBox(label,`<div class="mprice iap">${price}</div><small>${t('testBuy')}</small>`,()=>grantIAP(id));
}
function spend(cur,amt,label,ok){const have=cur==='tuy'?save.tuy:save.coins,cn=t(cur==='tuy'?'tuy':'coin');
  if(have<amt){Sfx.deny();return confirmBox(label,t('need',{a:amt,c:cn,h:have}),null);}
  confirmBox(label,`<div class="mprice">${amt} <canvas class="ic ic-${cur==='tuy'?'tuy':'coin'}" width="44" height="44"></canvas></div>`+t('spendQ',{a:amt,c:cn}),()=>{if(cur==='tuy')save.tuy-=amt;else save.coins-=amt;ok();persist();wallet();renderShop();Sfx.unlock();});}
function previewInto(c,themeId,skin){
  const T=buildTheme(themeId);T.setLevel(LV,GW,GH);const x=c.getContext('2d'),w=c.width,h=c.height,kk=w/GW*1.6;x.imageSmoothingEnabled=!T.pix;
  x.drawImage(T.sky,0,0,w,h);if(T.city)x.drawImage(T.city,0,h-T.cityH*w/GW*1.2,w,T.cityH*w/GW*1.2);
  const bl=(s,px,py,sc)=>{x.drawImage(s.c,px-s.ox*sc,py-s.oy*sc,s.w*sc,s.h*sc);};
  bl(T.getPlat('n',88),w*.18,h*.8,kk*.9);bl(heroSprite(T,skin,'up'),w*.5,h*.62,kk*1.1);
  if(T!==TH)TH.setLevel(LV,GW,GH);
}
function enPreview(c,id){const T=TH,x=c.getContext('2d'),w=c.width,h=c.height;x.imageSmoothingEnabled=!T.pix;x.drawImage(T.sky,0,0,w,h);
  const bl=(s,px,py,sc)=>{x.drawImage(s.c,px-s.ox*sc,py-s.oy*sc,s.w*sc,s.h*sc);};
  bl(T.enSpr('bat',id),w*.5,h*.26,.95);bl(T.getPlat('n',88),w*.14,h*.86,.95);bl(T.enSpr('zombie',id),w*.34,h*.86,1.05);bl(T.enSpr('ghost',id),w*.72,h*.66,1.05);}
function priceBtn(cls,amt,cur){const b=document.createElement('button');b.className=cls;b.innerHTML=`${amt} <canvas class="ic ic-${cur==='tuy'?'tuy':'coin'}" width="44" height="44"></canvas>`;return b;}
// "Restore purchases" (App Store requirement for non-consumables): Packs tab and Settings
function restorePurchases(){
  if(!(window.FlixNative&&FlixNative.restore)){confirmBox(t('restore'),t('restoreNone'),null);return;}
  $$('#restoreB,#restoreB2').forEach(b=>b.disabled=true);
  FlixNative.restore().then(ids=>{confirmBox(t('restore'),t(ids&&ids.length?'restoreOk':'restoreNone'),null);},()=>confirmBox(t('restore'),t('restoreFail'),null))
    .finally(()=>{$$('#restoreB,#restoreB2').forEach(b=>b.disabled=false);if(!$('#shop').hidden)renderShop();});
}
function renderShop(){
  const g=$('#shopGrid');g.innerHTML='';g.classList.toggle('one',shopTab==='pack');
  if(shopTab==='skin'||shopTab==='vil'){
    if(shopTab==='vil'){const hd=document.createElement('div');hd.className='world';hd.style.gridColumn='1/-1';hd.textContent=t('playT');g.appendChild(hd);}
    for(const id of (shopTab==='skin'?SKIN_ORDER:VILLAIN_ORDER)){const s=SKINS[id],own=save.skins.includes(id),sel=save.skin===id,locked=s.needLv&&save.done<s.needLv;
      const d=document.createElement('div');d.className='it'+(sel?' sel':'')+(locked?' lock':'');
      d.innerHTML=`<canvas class="pv" width="180" height="240"></canvas><div class="nm">${skinName(id)}</div><div class="tag">${locked?t('lockLv',{n:s.needLv}):own?t('owned'):''}</div>`;
      let bt;
      if(sel){bt=document.createElement('button');bt.textContent=t('selected');bt.className='b-on';bt.disabled=true;}
      else if(own){bt=document.createElement('button');bt.textContent=t('use');bt.className='b-use';bt.onclick=()=>{save.skin=id;persist();renderShop();};}
      else{bt=priceBtn('b-buy',s.price,s.cur);bt.disabled=!!locked;bt.onclick=()=>spend(s.cur,s.price,skinName(id),()=>{save.skins.push(id);save.skin=id;});}
      d.appendChild(bt);
      if(!own&&s.iap&&!locked){GRANTS[s.iapId]=()=>{if(!save.skins.includes(id))save.skins.push(id);save.skin=id;};const b2=document.createElement('button');b2.className='b-iap';b2.textContent=iapPrice(s.iapId,s.iap);b2.onclick=()=>buyIAP(s.iapId,skinName(id),iapPrice(s.iapId,s.iap));d.appendChild(b2);}
      g.appendChild(d);const c=d.querySelector('canvas.pv');setTimeout(()=>previewInto(c,save.theme,id),0);}
    if(shopTab==='vil'){
      const hd=document.createElement('div');hd.className='world';hd.style.gridColumn='1/-1';hd.innerHTML=t('enTitle')+'<small>'+t('enNote')+'</small>';g.appendChild(hd);
      for(const id of ENSKIN_ORDER){const s=ENSKINS[id],own=save.enSkins.includes(id),sel=save.enSkin===id;
        const d=document.createElement('div');d.className='it'+(sel?' sel':'');
        d.innerHTML=`<canvas class="pv" width="180" height="240"></canvas><div class="nm">${enName(id)}</div><div class="tag">${own&&id!=='none'?t('owned'):''}</div>`;
        let bt;const put=()=>{save.enSkin=id;ENSKIN=id;};
        if(sel){bt=document.createElement('button');bt.textContent=t('selected');bt.className='b-on';bt.disabled=true;}
        else if(own){bt=document.createElement('button');bt.textContent=t('use');bt.className='b-use';bt.onclick=()=>{put();persist();renderShop();};}
        else{bt=priceBtn('b-buy',s.price,'coin');bt.onclick=()=>spend('coin',s.price,enName(id),()=>{save.enSkins.push(id);put();});}
        d.appendChild(bt);g.appendChild(d);const c=d.querySelector('canvas.pv');setTimeout(()=>enPreview(c,id),0);}
    }
  }else if(shopTab==='theme'){
    const q=[];
    for(const id of THEME_ORDER){const th=THEMES[id],own=save.themes.includes(id),sel=save.theme===id;
      const d=document.createElement('div');d.className='it'+(sel?' sel':'');
      d.innerHTML=`<canvas class="pv" width="180" height="240"></canvas><div class="nm">${themeName(id)}</div><div class="tag">${own?t('owned'):''}</div>`;
      let bt;
      if(sel){bt=document.createElement('button');bt.textContent=t('selected');bt.className='b-on';bt.disabled=true;}
      else if(own){bt=document.createElement('button');bt.textContent=t('use');bt.className='b-use';bt.onclick=()=>{save.theme=id;persist();setTheme(id);renderShop();};}
      else{bt=priceBtn('b-buy',th.price,'tuy');bt.onclick=()=>spend('tuy',th.price,themeName(id),()=>{save.themes.push(id);save.theme=id;setTheme(id);});}
      d.appendChild(bt);
      if(!own&&th.iap){const pid='jump_theme_'+id;GRANTS[pid]=()=>{if(!save.themes.includes(id))save.themes.push(id);save.theme=id;setTheme(id);};const b2=document.createElement('button');b2.className='b-iap';b2.textContent=iapPrice(pid,th.iap);b2.onclick=()=>buyIAP(pid,themeName(id),iapPrice(pid,th.iap));d.appendChild(b2);}
      g.appendChild(d);q.push([d.querySelector('canvas.pv'),id]);}
    const next=()=>{const it=q.shift();if(!it||$('#shop').hidden||shopTab!=='theme')return;previewInto(it[0],it[1],save.skin);setTimeout(next,10);};setTimeout(next,30);
  }else{
    for(const p of PACKS){const d=document.createElement('div');d.className='it pk';
      const own=(p.give.noads&&save.noads)||(p.give.themes&&save.themes.length>=9);
      d.innerHTML=`<canvas class="pi" width="96" height="96"></canvas><div class="pt"><div class="nm">${t(p.name)}${p.best?`<span class="badge">${t('bestSeller')}</span>`:''}</div></div>`;
      GRANTS[p.id]=()=>{if(p.give.tuy)save.tuy+=p.give.tuy;if(p.give.coins)save.coins+=p.give.coins;if(p.give.noads){save.noads=true;if(window.FlixAds)FlixAds.setAdsRemoved(true);}if(p.give.themes)save.themes=THEME_ORDER.slice();};
      const bt=document.createElement('button');bt.className=own?'b-on':'b-iap';bt.textContent=own?t('bought'):iapPrice(p.id,p.iap);bt.disabled=own;bt.onclick=()=>buyIAP(p.id,t(p.name),iapPrice(p.id,p.iap));
      d.appendChild(bt);g.appendChild(d);
      const pc=d.querySelector('.pi'),x=pc.getContext('2d');
      if(p.ic==='tuy'){for(let i=0;i<p.n;i++)sprInto(pc,TH.spr.tuy,1.5-p.n*.08,48+(i-(p.n-1)/2)*13,74-(i%2)*8);}
      else if(p.ic==='coin'){for(let i=0;i<4;i++)sprInto(pc,TH.spr.coin,2,34+i%2*26,62-i*10);}
      else if(p.ic==='all'){['clay','cel','dark'].forEach((id,i)=>{x.save();x.translate(18+i*22,14+i*6);x.rotate(-.12+i*.12);x.fillStyle=['#ff8a5a','#46208a','#120c22'][i];x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.roundRect(0,0,36,52,6);x.fill();x.stroke();x.restore();});sprInto(pc,heroSprite(TH,save.skin,'up'),.7,60,60);}
      else{sprInto(pc,TH.spr.bat,.8,48,50);x.strokeStyle='#e22511';x.lineWidth=8;x.lineCap='round';x.beginPath();x.arc(48,48,36,0,TAU);x.moveTo(23,23);x.lineTo(73,73);x.stroke();}}
    const n=document.createElement('div');n.className='tag';n.style.cssText='text-align:center;padding:4px 10px';n.textContent=t('tuyNote');g.appendChild(n);
    const rb=document.createElement('button');rb.className='big ghost';rb.id='restoreB';rb.style.cssText='grid-column:1/-1;width:100%;margin-top:4px';rb.textContent=t('restore');rb.onclick=restorePurchases;g.appendChild(rb);
  }
  drawIcons();
}
// ---------- boot
FlixLegal.init({game:'ziplama',name:'Flix Jump',version:VERSION,oss:['Nova Hop (ISC, Nikhil Rana)','Baloo 2, Luckiest Guy, Press Start 2P, Cinzel Decorative (SIL OFL)'],
  beforeOpen:()=>{if(state==='play')pauseGame();}});
$$('#hudLogo,#menuLogo,#adLogo').forEach(i=>i.src=LOGO);
Sfx.setMuted(save.muted);if(save.noads&&window.FlixAds)FlixAds.setAdsRemoved(true);
if(window.FlixNative&&FlixNative.flush)try{FlixNative.flush();}catch(e){}
if(!THEMES[save.theme]||!save.themes.includes(save.theme))save.theme='water';
if(!SKINS[save.skin])save.skin='kraliyet';
document.fonts.ready.then(()=>{mode='menu';LV=LEVELS[curLevel()-1];setTheme(save.theme);resetWorld();applyLang();show('#menu');requestAnimationFrame(frame);});
</script>
</body></html>
